[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "natras"
version = "0.1.0"
description = "NAT RAS - Modular Local Algorithmic Trading & Research Platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "NAT RAS Team" }
]
dependencies = [
    "pytz>=2024.1",
    "python-dateutil>=2.8.2"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0"
]

[project.scripts]
natras = "natras.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.setuptools.packages.find]
where = ["."]
include = ["natras*"]
exclude = ["data*", "tests*", "docs*"]

